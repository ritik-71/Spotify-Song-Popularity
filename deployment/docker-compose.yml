version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: musemind_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secure_postgres_pass_2026
      POSTGRES_DB: musemind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Rate Limiting
  redis_cache:
    image: redis:7-alpine
    container_name: musemind_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Qdrant Vector Similarity Store
  qdrant_vector:
    image: qdrant/qdrant:latest
    container_name: musemind_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. FastAPI Inference and Core Backend Gateway
  backend_api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: musemind_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=super_secure_postgres_pass_2026
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=musemind
      - REDIS_URL=redis://redis_cache:6379/0
      - QDRANT_URL=http://qdrant_vector:6333
      - JWT_SECRET=SUPER_SECURE_MUSEMIND_JWT_SECRET_KEY_FOR_LOCAL_DEV_2026
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      qdrant_vector:
        condition: service_healthy

  # 5. Next.js Analytics Frontend
  frontend_app:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: musemind_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend_api:8000/api/v1
    depends_on:
      - backend_api

volumes:
  pgdata:
  redisdata:
  qdrantdata:
