apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musemind-ingress
  namespace: musemind-ai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  rules:
  - host: api.musemind.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: musemind-backend-service
            port:
              number: 80
  - host: app.musemind.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: musemind-frontend-service
            port:
              number: 80
