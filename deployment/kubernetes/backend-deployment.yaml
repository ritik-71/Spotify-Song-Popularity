apiVersion: apps/v1
kind: Deployment
metadata:
  name: musemind-backend
  namespace: musemind-ai
  labels:
    app: musemind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: musemind-backend
  template:
    metadata:
      labels:
        app: musemind-backend
    spec:
      containers:
      - name: backend
        image: musemind-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "musemind"
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: jwt-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: musemind-backend-service
  namespace: musemind-ai
spec:
  type: ClusterIP
  selector:
    app: musemind-backend
  ports:
  - port: 80
    targetPort: 8000
